# nginx do frontend: serve os estáticos e faz proxy de /api para o backend.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Permite upload de imagens (até 4 MB) via proxy para /api/v1/uploads.
    client_max_body_size 4m;

    # SPA: qualquer rota não-arquivo cai no index.html (hash router cuida do resto).
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy das chamadas de API para o serviço backend.
    location /api/ {
        proxy_pass http://backend:5050;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # HTML sem cache: meta-refresh do /progresso.html sempre pega a versão nova.
    location ~* \.html$ {
        add_header Cache-Control "no-cache, must-revalidate";
    }
    # JS/CSS sem cache agressivo: o navegador revalida sempre (pega atualizações na hora).
    location ~* \.(css|js)$ {
        add_header Cache-Control "no-cache, must-revalidate";
    }
    # Imagens/fontes podem ter cache.
    location ~* \.(svg|png|jpg|jpeg|gif|ico|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public";
    }
}
